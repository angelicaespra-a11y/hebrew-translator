<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לשון — Language Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Newsreader:ital,wght@0,400;0,500;1,500&family=Gveret+Levin&family=Assistant:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f1e6;
    --card:#fffdf7;
    --ink:#3c2f26;
    --ink-soft:rgba(60,47,38,0.62);
    --ink-faint:rgba(60,47,38,0.38);
    --clay:#c1683f;
    --clay-soft:#e3a074;
    --sage:#748a5f;
    --sage-soft:#c7d4b8;
    --line:rgba(60,47,38,0.12);
    --shadow:0 3px 16px rgba(60,47,38,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:radial-gradient(circle at 15% 8%, rgba(193,104,63,0.06), transparent 40%),
                      radial-gradient(circle at 90% 85%, rgba(116,138,95,0.08), transparent 45%);
    color:var(--ink);
    font-family:'Assistant', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 20px 90px;
  }
  .wrap{width:100%;max-width:940px;}
  header{
    text-align:center;
    margin-bottom:40px;
  }
  .kicker{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--clay);
    font-weight:600;
    margin-bottom:10px;
  }
  h1{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:500;
    font-size:38px;
    margin:0;
    color:var(--ink);
  }
  h1 span{color:var(--sage);}
  .key-row{
    max-width:480px;
    margin:0 auto 32px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    gap:8px;
    align-items:center;
    box-shadow:var(--shadow);
  }
  .key-row input{
    flex:1;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    font-family:'Assistant',sans-serif;
    font-size:13px;
    outline:none;
    background:var(--paper);
    color:var(--ink);
  }
  .key-row button{
    background:var(--clay);
    color:#fff8f2;
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:'Assistant',sans-serif;
  }
  .key-note{font-size:11px;color:var(--ink-faint);text-align:center;margin-top:6px;}
  .key-row.saved input{border-color:var(--sage);}
  .panels{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:0;
    align-items:stretch;
  }
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:24px 26px;
    display:flex;
    flex-direction:column;
    min-height:270px;
  }
  .panel-label{
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  select.lang-select{
    font-family:'Assistant',sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--ink);
    background:var(--sage-soft);
    border:none;
    border-radius:999px;
    padding:6px 14px;
    cursor:pointer;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
  }
  .cursive-toggle{
    color:var(--sage);
    cursor:pointer;
    font-size:12px;
    background:none;
    border:none;
    padding:4px 6px;
    font-family:'Assistant',sans-serif;
    font-weight:600;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .cursive-toggle.hidden{display:none;}
  textarea{
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:var(--ink);
    font-size:20px;
    line-height:1.7;
    flex:1;
  }
  textarea::placeholder{color:var(--ink-faint);font-family:'Assistant',sans-serif;font-size:14px;}
  .cursive{
    margin-top:16px;
    padding-top:16px;
    border-top:1px dashed var(--line);
    font-family:'Gveret Levin', cursive;
    font-size:30px;
    line-height:1.5;
    direction:rtl;
    text-align:right;
    color:var(--clay);
    min-height:44px;
  }
  .cursive.empty{display:none;}
  .bridge{
    width:80px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
  }
  .arrow{
    width:48px;height:48px;border-radius:50%;
    border:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--clay);
    color:#fff8f2;
    cursor:pointer;
    font-size:19px;
    box-shadow:0 4px 14px rgba(193,104,63,0.35);
    transition:transform .15s, box-shadow .15s;
  }
  .arrow:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(193,104,63,0.42);}
  .arrow:active{transform:scale(0.94);}
  .arrow:disabled{opacity:0.55;cursor:default;}
  .arrow.spin{animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(-360deg);}}
  .flow-dots{display:flex;flex-direction:column;gap:6px;height:60px;justify-content:center;}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--sage);opacity:0.5;}
  .notes{
    margin-top:26px;
    background:#fbf3e6;
    border:1px solid rgba(193,104,63,0.18);
    border-radius:16px;
    padding:16px 20px;
    font-size:14px;
    line-height:1.7;
    color:var(--ink-soft);
  }
  .notes.empty{display:none;}
  .notes-label{
    font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--clay);margin-bottom:8px;font-weight:600;
  }
  .err{color:#b6503a;font-size:13px;margin-top:16px;text-align:center;}
  .history-wrap{margin-top:36px;}
  .history-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:600;
    margin-bottom:12px;
    padding:0 4px;
  }
  .clear-history{
    background:none;
    border:none;
    color:var(--clay);
    font-size:12px;
    font-weight:600;
    text-transform:none;
    letter-spacing:0;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:2px;
    font-family:'Assistant',sans-serif;
  }
  .history-item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s;
  }
  .history-item:hover{border-color:var(--clay-soft);}
  .history-meta{
    font-size:11px;
    color:var(--ink-faint);
    margin-bottom:6px;
    font-weight:600;
    letter-spacing:0.04em;
  }
  .history-row{
    display:flex;
    gap:14px;
    font-size:14px;
    line-height:1.5;
  }
  .history-side{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft);}
  .history-arrow{color:var(--sage);flex-shrink:0;}
  @media (max-width:720px){
    .panels{grid-template-columns:1fr;gap:14px;}
    .bridge{flex-direction:row;width:100%;padding:2px 0;}
    .arrow{transform:rotate(90deg);}
    .arrow.spin{transform:none;}
    .flow-dots{flex-direction:row;height:auto;width:60px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Translate, warmly</div>
    <h1>ל<span>שון</span></h1>
  </header>

  <div>
    <div class="key-row" id="keyRow">
      <input type="password" id="apiKeyInput" placeholder="Paste your Anthropic API key (sk-ant-...)">
      <button id="saveKey">Save</button>
    </div>
    <div class="key-note">Stored only in this browser, on this device. Get a key at console.anthropic.com.</div>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-label">
        <select class="lang-select" id="langA"></select>
        <button class="cursive-toggle" id="cursiveToggleA">כתב יד</button>
      </div>
      <textarea id="boxA" dir="rtl"></textarea>
      <div class="cursive empty" id="cursiveA"></div>
    </div>

    <div class="bridge">
      <div class="flow-dots" id="dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <button class="arrow" id="go" title="Translate now">⇄</button>
    </div>

    <div class="panel">
      <div class="panel-label">
        <select class="lang-select" id="langB"></select>
        <button class="cursive-toggle hidden" id="cursiveToggleB">כתב יד</button>
      </div>
      <textarea id="boxB"></textarea>
      <div class="cursive empty" id="cursiveB"></div>
    </div>
  </div>

  <div class="notes empty" id="notes">
    <div class="notes-label">A note</div>
    <div id="notes-text"></div>
  </div>

  <div class="err" id="err"></div>

  <div class="history-wrap" id="historyWrap" style="display:none;">
    <div class="history-head">
      <span>Recent translations</span>
      <button class="clear-history" id="clearHistory">Clear</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
const LANGS = {
  he:  { label: 'עברית',          rtl: true,  api: 'Hebrew',            placeholder: 'הקלד או הדבק כאן טקסט בעברית...',       font: "'Frank Ruhl Libre', serif" },
  en:  { label: 'English',        rtl: false, api: 'English',           placeholder: 'Type or paste English text here...',    font: "'Newsreader', serif" },
  tl:  { label: 'Tagalog',        rtl: false, api: 'Tagalog',           placeholder: 'I-type o i-paste ang teksto dito...',   font: "'Newsreader', serif" },
  ceb: { label: 'Bisaya (Cebuano)', rtl: false, api: 'Bisaya (Cebuano)', placeholder: 'I-type o i-paste ang teksto dinhi...', font: "'Newsreader', serif" }
};

const langAEl = document.getElementById('langA');
const langBEl = document.getElementById('langB');
const boxA = document.getElementById('boxA');
const boxB = document.getElementById('boxB');
const cursiveA = document.getElementById('cursiveA');
const cursiveB = document.getElementById('cursiveB');
const cursiveToggleA = document.getElementById('cursiveToggleA');
const cursiveToggleB = document.getElementById('cursiveToggleB');
const notesEl = document.getElementById('notes');
const notesTextEl = document.getElementById('notes-text');
const goBtn = document.getElementById('go');
const errEl = document.getElementById('err');

let state = { A: 'he', B: 'en' };
let cursiveOn = { A: true, B: true };
let lastEdited = 'A';
let suppress = false;
let debounceTimer = null;
let history = [];

const apiKeyInput = document.getElementById('apiKeyInput');
const saveKeyBtn = document.getElementById('saveKey');
const keyRow = document.getElementById('keyRow');

function loadKey() {
  const saved = localStorage.getItem('lashon_api_key');
  if (saved) {
    apiKeyInput.value = saved;
    keyRow.classList.add('saved');
  }
}
function getKey() {
  return apiKeyInput.value.trim();
}
saveKeyBtn.addEventListener('click', () => {
  const key = getKey();
  if (key) {
    localStorage.setItem('lashon_api_key', key);
    keyRow.classList.add('saved');
  } else {
    localStorage.removeItem('lashon_api_key');
    keyRow.classList.remove('saved');
  }
});
loadKey();

const historyWrap = document.getElementById('historyWrap');
const historyList = document.getElementById('historyList');
const clearHistoryBtn = document.getElementById('clearHistory');

function renderHistory() {
  if (!history.length) {
    historyWrap.style.display = 'none';
    return;
  }
  historyWrap.style.display = 'block';
  historyList.innerHTML = '';
  history.forEach((item, idx) => {
    const el = document.createElement('div');
    el.className = 'history-item';
    const time = item.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    el.innerHTML = `
      <div class="history-meta">${LANGS[item.fromLang].label} → ${LANGS[item.toLang].label} · ${time}</div>
      <div class="history-row">
        <div class="history-side" dir="${LANGS[item.fromLang].rtl ? 'rtl' : 'ltr'}"></div>
        <div class="history-arrow">→</div>
        <div class="history-side" dir="${LANGS[item.toLang].rtl ? 'rtl' : 'ltr'}"></div>
      </div>`;
    const sides = el.querySelectorAll('.history-side');
    sides[0].textContent = item.fromText;
    sides[1].textContent = item.toText;
    el.addEventListener('click', () => restoreHistory(idx));
    historyList.appendChild(el);
  });
}

function restoreHistory(idx) {
  const item = history[idx];
  setLang('A', item.fromLang);
  setLang('B', item.toLang);
  suppress = true;
  boxA.value = item.fromText;
  boxB.value = item.toText;
  suppress = false;
  updateCursive('A');
  updateCursive('B');
  notesEl.classList.add('empty');
}

function addHistory(fromLang, toLang, fromText, toText) {
  if (!fromText.trim() || !toText.trim()) return;
  const last = history[0];
  if (last && last.fromText === fromText && last.fromLang === fromLang && last.toLang === toLang) return;
  history.unshift({ fromLang, toLang, fromText, toText, time: new Date() });
  if (history.length > 20) history.pop();
  renderHistory();
}

clearHistoryBtn.addEventListener('click', () => {
  history = [];
  renderHistory();
});

function populateSelect(sel, selected) {
  sel.innerHTML = '';
  Object.keys(LANGS).forEach(code => {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = LANGS[code].label;
    if (code === selected) opt.selected = true;
    sel.appendChild(opt);
  });
}

function applyPanelStyle(side) {
  const box = side === 'A' ? boxA : boxB;
  const toggle = side === 'A' ? cursiveToggleA : cursiveToggleB;
  const cur = side === 'A' ? cursiveA : cursiveB;
  const lang = LANGS[state[side]];

  box.dir = lang.rtl ? 'rtl' : 'ltr';
  box.style.textAlign = lang.rtl ? 'right' : 'left';
  box.style.fontFamily = lang.font;
  box.placeholder = lang.placeholder;

  if (state[side] === 'he') {
    toggle.classList.remove('hidden');
    updateCursive(side);
  } else {
    toggle.classList.add('hidden');
    cur.classList.add('empty');
    cur.textContent = '';
  }
}

function updateCursive(side) {
  const box = side === 'A' ? boxA : boxB;
  const cur = side === 'A' ? cursiveA : cursiveB;
  const text = box.value.trim();
  if (!cursiveOn[side] || state[side] !== 'he' || !text) {
    cur.classList.add('empty');
    cur.textContent = '';
    return;
  }
  cur.textContent = text;
  cur.classList.remove('empty');
}

function setLang(side, code) {
  const other = side === 'A' ? 'B' : 'A';
  if (code === state[other]) {
    state[other] = state[side];
    populateSelect(other === 'A' ? langAEl : langBEl, state[other]);
    applyPanelStyle(other);
  }
  state[side] = code;
  applyPanelStyle(side);
}

populateSelect(langAEl, state.A);
populateSelect(langBEl, state.B);
applyPanelStyle('A');
applyPanelStyle('B');

langAEl.addEventListener('change', () => setLang('A', langAEl.value));
langBEl.addEventListener('change', () => setLang('B', langBEl.value));

cursiveToggleA.addEventListener('click', () => {
  cursiveOn.A = !cursiveOn.A;
  cursiveToggleA.style.opacity = cursiveOn.A ? '1' : '0.5';
  updateCursive('A');
});
cursiveToggleB.addEventListener('click', () => {
  cursiveOn.B = !cursiveOn.B;
  cursiveToggleB.style.opacity = cursiveOn.B ? '1' : '0.5';
  updateCursive('B');
});

function clearOther(side) {
  const other = side === 'A' ? 'B' : 'A';
  const otherBox = other === 'A' ? boxA : boxB;
  suppress = true;
  otherBox.value = '';
  suppress = false;
  updateCursive(other);
  notesEl.classList.add('empty');
  errEl.textContent = '';
}

boxA.addEventListener('input', () => {
  updateCursive('A');
  if (suppress) return;
  if (!boxA.value.trim()) {
    clearTimeout(debounceTimer);
    clearOther('A');
    return;
  }
  scheduleTranslate('A');
});
boxB.addEventListener('input', () => {
  updateCursive('B');
  if (suppress) return;
  if (!boxB.value.trim()) {
    clearTimeout(debounceTimer);
    clearOther('B');
    return;
  }
  scheduleTranslate('B');
});

async function translateFrom(side) {
  const other = side === 'A' ? 'B' : 'A';
  const fromBox = side === 'A' ? boxA : boxB;
  const toBox = other === 'A' ? boxA : boxB;
  const fromLang = LANGS[state[side]];
  const toLang = LANGS[state[other]];
  const text = fromBox.value.trim();
  errEl.textContent = '';

  if (!text) {
    notesEl.classList.add('empty');
    return;
  }

  const key = getKey();
  if (!key) {
    errEl.textContent = 'Add your Anthropic API key above to translate.';
    return;
  }

  goBtn.classList.add('spin');
  goBtn.disabled = true;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: `You are an expert ${fromLang.api}-to-${toLang.api} translator. Translate the text into natural, fluent, contextually accurate ${toLang.api} — not a stiff literal rendering. Preserve tone, register, and intent. If there is slang, idiom, ambiguity, or cultural context worth flagging, add a brief note. Respond with ONLY a JSON object, no markdown fences, no preamble: {"translation": "...", "notes": "..."}. If there is nothing notable, set notes to an empty string.`,
        messages: [{ role: "user", content: text }]
      })
    });

    const data = await response.json();
    if (!response.ok) {
      errEl.textContent = data?.error?.message || 'Translation failed — check your API key.';
      return;
    }
    const raw = (data.content || []).map(b => b.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    let parsed;
    try {
      parsed = JSON.parse(clean);
    } catch (e) {
      parsed = { translation: clean, notes: '' };
    }

    suppress = true;
    toBox.value = parsed.translation || '';
    suppress = false;
    updateCursive(other);
    addHistory(state[side], state[other], text, parsed.translation || '');

    if (parsed.notes && parsed.notes.trim()) {
      notesTextEl.textContent = parsed.notes.trim();
      notesEl.classList.remove('empty');
    } else {
      notesEl.classList.add('empty');
    }
  } catch (e) {
    errEl.textContent = 'Translation failed. Check your connection and try again.';
  } finally {
    goBtn.classList.remove('spin');
    goBtn.disabled = false;
  }
}

function scheduleTranslate(side) {
  lastEdited = side;
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => translateFrom(side), 900);
}

goBtn.addEventListener('click', () => translateFrom(lastEdited));

[boxA, boxB].forEach((el, i) => {
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      translateFrom(i === 0 ? 'A' : 'B');
    }
  });
});
</script>
</body>
</html>
